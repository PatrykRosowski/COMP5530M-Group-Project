services:
  valhalla:
    image: ghcr.io/nilsnolde/docker-valhalla/valhalla:latest
    container_name: valhalla
    ports:
      - "8002:8002"
    volumes:
      - ./routing_engine:/custom_files
    environment:
      - tile_urls=https://download.geofabrik.de/europe/united-kingdom/england/greater-manchester-latest.osm.pbf
      - build_elevation=False
      - build_admins=False
      - build_time_zones=False
      - force_rebuild=True